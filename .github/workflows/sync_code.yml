name: Sync Codebase

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target_repo

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: duckyduckG/android_kernel_xiaomi_sdm845_419
          path: source_repo

      - name: Process and sync files
        run: |
          cd target_repo
          
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='drivers/clk/qcom/gpucc-sdm845.c' \
            --exclude='arch/arm64/boot/dts/qcom/sdm845-v2.dtsi' \
            --exclude='drivers/clk/qcom/vdd-level-sdm845.h' \
            ../source_repo/ ./
            
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto sync codebase preserving specific custom kernel modifications" || echo "No changes to commit"
          git push
